[tool.ruff]
# Set the maximum line length to 120
line-length = 120

# Assume Python 3.11
target-version = "py311"

# Exclude common junk folders from being scanned
exclude = [
    ".git",
    ".github",
    "__pycache__",
    ".venv",
    "venv",
]

[tool.ruff.lint]
# Enable specific rule sets:
# E = pycodestyle errors (formatting)
# F = Pyflakes (logical errors like unused imports)
# I = isort (automatically sorts imports alphabetically)
select = ["E", "F", "I"]

# Ignore specific rules
ignore = []

# Allow unused variables when they start with an underscore
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection functions are safe to use in defaults
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header"
]